name: astrbot_plugin_bugland_query
display_name: 布吉岛查询
short_desc: 说人话就能查布吉岛战绩、排行榜、公会
desc: >-
  基于 BuGLand API 的布吉岛查询插件。绑定游戏昵称后，直接用自然语言查询玩家资料、
  各模式战绩（起床战争、空岛战争、职业战争等细分小类分开统计）、排行榜、公会信息
  和最近对局，并自动计算胜率、K/D、终结击杀等指标，结果渲染成卡片图返回。
version: 1.1.0
author: 比行
repo: https://github.com/hanguan512/astrbot_plugin_bugland_query
astrbot_version: ">=4.17.0"
support_platforms:
  - aiocqhttp
  - qq_official
tags:
  - 游戏
  - 查询
  - 布吉岛
  - minecraft
